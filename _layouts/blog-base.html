<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

{% assign display_title = page.seo_title | default: page.title %}
<title>{% if display_title %}{{ display_title }} | {% endif %}Karachi Jumma Biryani Blog</title>

<meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="author" content="{{ page.author | default: site.author }}">
<meta name="theme-color" content="#2E7D32">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- Favicons -->
<link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">

<!-- Open Graph / Twitter -->
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:site_name" content="Karachi Jumma Biryani">
<meta property="og:title" content="{{ display_title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ page.image | default: '/images/chick-biryani.jpg' | absolute_url }}">
<meta property="og:locale" content="en_US">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ display_title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description | strip_newlines }}">
<meta name="twitter:image" content="{{ page.image | default: '/images/chick-biryani.jpg' | absolute_url }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Karachi Jumma Biryani",
  "url": {{ site.url | append: '/' | jsonify }}
}
</script>

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Poppins',sans-serif;
background:#FFF8E1;
color:#333;
overflow-x:hidden;
}

a{color:inherit;}

/* Nav (matches homepage) */

nav{
position:sticky;
top:0;
left:0;
width:100%;
padding:18px 8%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,.95);
backdrop-filter:blur(12px);
z-index:1000;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.logo img{height:56px;width:auto;display:block;}

nav ul{display:flex;gap:30px;list-style:none;}

nav ul li a{text-decoration:none;color:#444;font-weight:600;transition:.3s;}

nav ul li a:hover{color:#4CAF50;}

.order-btn{
background:#4CAF50;
padding:10px 22px;
border-radius:40px;
color:white;
text-decoration:none;
font-weight:600;
white-space:nowrap;
}

.nav-toggle{
display:none;
background:none;
border:none;
font-size:24px;
color:#2E7D32;
cursor:pointer;
padding:6px 10px;
}

/* Tablet / small laptop: collapse nav into hamburger before items get cramped */

@media(max-width:1100px){
nav ul{
display:none;
position:absolute;
top:100%;
left:0;
width:100%;
flex-direction:column;
gap:0;
background:white;
box-shadow:0 15px 25px rgba(0,0,0,.15);
padding:10px 0;
}
nav ul.mobile-open{display:flex;}
nav ul li{width:100%;}
nav ul li a{display:block;padding:14px 8%;border-bottom:1px solid #f0f0f0;}
.nav-toggle{display:flex;align-items:center;justify-content:center;}
nav{padding:14px 5%;gap:10px;}
}

@media(max-width:768px){
.logo img{height:46px;}
.order-btn{padding:8px 14px;font-size:12.5px;}
}

/* Blog layout */

.blog-main{
max-width:900px;
margin:0 auto;
padding:60px 6% 100px;
}

.blog-breadcrumbs{
font-size:14px;
color:#777;
margin-bottom:25px;
}

.blog-breadcrumbs a{color:#4CAF50;text-decoration:none;font-weight:600;}

.blog-hero-image{
width:100%;
max-height:480px;
object-fit:cover;
border-radius:18px;
margin-bottom:30px;
box-shadow:0 15px 35px rgba(0,0,0,.1);
}

.blog-title{
font-size:38px;
font-weight:800;
color:#2E7D32;
margin-bottom:16px;
line-height:1.2;
}

.blog-meta{
display:flex;
flex-wrap:wrap;
gap:16px;
color:#777;
font-size:14px;
margin-bottom:35px;
}

.blog-meta span{display:inline-flex;align-items:center;gap:6px;}

.blog-badge{
display:inline-block;
padding:6px 16px;
background:#AED581;
border-radius:30px;
font-size:12.5px;
font-weight:700;
color:#2E7D32;
}

.blog-tags{
display:flex;
flex-wrap:wrap;
gap:10px;
margin:30px 0;
}

.blog-tags span{
background:#eef6ea;
color:#2E7D32;
padding:6px 14px;
border-radius:30px;
font-size:13px;
font-weight:600;
}

.blog-content{
font-size:17px;
line-height:1.9;
color:#3a3a3a;
}

.blog-content h2{color:#2E7D32;margin:40px 0 16px;font-size:26px;}
.blog-content h3{color:#2E7D32;margin:30px 0 14px;font-size:21px;}
.blog-content p{margin-bottom:18px;}
.blog-content ul,.blog-content ol{margin:0 0 18px 22px;}
.blog-content img{max-width:100%;border-radius:14px;margin:20px 0;}
.blog-content a{color:#2E7D32;font-weight:600;}

.blog-gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:16px;
margin:30px 0;
}

.blog-gallery img{
width:100%;
height:180px;
object-fit:cover;
border-radius:14px;
}

.blog-faq{
margin:45px 0;
}

.blog-faq details{
background:white;
padding:18px 20px;
border-radius:12px;
margin-bottom:14px;
box-shadow:0 5px 15px rgba(0,0,0,.06);
}

.blog-faq summary{font-weight:700;cursor:pointer;}

.blog-faq p{margin-top:12px;line-height:1.7;color:#555;}

.blog-related{
margin-top:60px;
padding-top:40px;
border-top:2px solid #eee;
}

.blog-related h2{color:#2E7D32;font-size:24px;margin-bottom:25px;}

.blog-related-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.blog-card{
background:white;
border-radius:16px;
overflow:hidden;
text-decoration:none;
box-shadow:0 10px 25px rgba(0,0,0,.08);
transition:.3s;
}

.blog-card:hover{transform:translateY(-6px);}

.blog-card img{width:100%;height:150px;object-fit:cover;}

.blog-card-content{padding:16px;}

.blog-card-content h3{color:#2E7D32;font-size:16px;margin-bottom:6px;}

.blog-card-content p{color:#777;font-size:13px;}

/* Blog listing page */

.blog-list-header{text-align:center;margin-bottom:50px;}

.blog-list-header h1{font-size:42px;color:#2E7D32;font-weight:800;margin-bottom:12px;}

.blog-list-header p{color:#777;font-size:18px;}

.blog-list-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
}

/* Footer */

footer{background:#1B1B1B;color:white;padding:50px 8% 30px;margin-top:60px;}

footer a{color:#ddd;text-decoration:none;}

footer a:hover{color:#AED581;}

.whatsapp-float{
position:fixed;
bottom:25px;
right:25px;
width:60px;
height:60px;
border-radius:50%;
background:#25D366;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
color:white;
text-decoration:none;
box-shadow:0 15px 35px rgba(37,211,102,.45);
z-index:999;
}

.icon{width:1em;height:1em;display:inline-block;fill:currentColor;vertical-align:-0.125em;}

</style>

</head>

<body>

{% include blog-nav.html %}

<main class="blog-main">
{{ content }}
</main>

{% include blog-footer.html %}

<a href="https://api.whatsapp.com/send?phone=966564241776&text=Hi%2C%20I%20am%20contacting%20you%20through%20your%20blog.%20I%20am%20interested%20in%20Karachi%20Jumma%20Biryani."
   class="whatsapp-float" target="_blank" aria-label="Chat on WhatsApp">
<svg class="icon" aria-hidden="true"><use href="#icon-whatsapp"></use></svg>
</a>

<script>
const navToggle = document.getElementById("navToggle");
const navList = document.getElementById("navList");

if(navToggle && navList){
const navToggleIcon = navToggle.querySelector("svg use");

navToggle.addEventListener("click", ()=>{
const isOpen = navList.classList.toggle("mobile-open");
navToggleIcon.setAttribute("href", isOpen ? "#icon-xmark" : "#icon-bars");
});

navList.querySelectorAll("a").forEach((link)=>{
link.addEventListener("click", ()=>{
navList.classList.remove("mobile-open");
navToggleIcon.setAttribute("href", "#icon-bars");
});
});
}
</script>

</body>
</html>
